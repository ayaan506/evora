<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Evora</title>
    
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/E for evora.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='concerts.css') }}">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .auth-wrapper {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            margin-top: 60px;
        }
        .auth-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            padding: 36px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin: 0 0 6px 0;
        }
        .auth-header p {
            font-size: 13px;
            color: #64748b;
            margin: 0;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        .btn-auth-submit {
            width: 100%;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            color: #ffffff;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            margin-top: 8px;
        }
        .btn-auth-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        .auth-alert-box {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #b91c1c;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 16px;
            display: none;
        }
        .otp-input-field {
            letter-spacing: 6px;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            color: #7c3aed;
        }
    </style>
</head>
<body class="light-theme">

    <!-- NAVIGATION BAR -->
    <nav class="light-nav">
        <a href="/" class="nav-logo-group" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
            <div class="nav-logo-spacer" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; overflow: visible;">
                <img src="{{ url_for('static', filename='images/E for evora.png') }}" alt="Evora" class="nav-branded-logo-img" style="width: 100%; height: 100%; object-fit: contain; transform: scale(1.10);" onerror="this.style.display='none'">
            </div>  
            <span class="nav-logo-text" style="font-size: 24px; font-weight: 700;">evora</span>
        </a>
        <div class="light-nav-links">
            <a href="/events">Events</a>
            <a href="/planner">Plan My Event</a>
            <a href="/manpower">Hire Staff</a>
            <a href="/venues">Venues</a>
            <a href="/contact">Contact</a>
        </div>
        <div class="light-nav-actions">
            <a href="/login" class="btn-light-login">Login</a>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="auth-header">
                <h1>Create Account</h1>
                <p>Sign up to book concert passes, venues, and event crew.</p>
            </div>

            <div id="signup-error-alert" class="auth-alert-box"></div>

            <!-- STEP 1: REGISTRATION INPUT FORM -->
            <form id="signup-step1-form" onsubmit="requestSignupOTP(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-fullname" class="form-input" placeholder="e.g. Rahul Sharma" autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label>Email Address (OTP will be sent here)</label>
                    <input type="email" id="reg-email" class="form-input" placeholder="name@example.com" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="reg-phone" class="form-input" placeholder="+91 98765 43210" autocomplete="tel" required>
                </div>

                <!-- 1. Password Field -->
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" class="form-input" placeholder="Create a strong password (min 6 chars)" minlength="6" autocomplete="new-password" required>
                </div>

                <!-- 2. Confirm Password Field -->
                <div class="form-group">
                    <label>Re-enter Password</label>
                    <input type="password" id="reg-confirm-password" class="form-input" placeholder="Re-enter your password" minlength="6" autocomplete="new-password" required>
                </div>

                <button type="submit" id="btn-request-otp" class="btn-auth-submit">
                    Send Verification Code <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <!-- STEP 2: OTP VERIFICATION VIEW -->
            <div id="signup-step2-box" style="display: none; text-align: center;">
                <div style="width: 52px; height: 52px; border-radius: 50%; background: #ede9fe; color: #7c3aed; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; font-size: 22px;">
                    <i class="fa-solid fa-envelope-circle-check"></i>
                </div>
                <h3 style="margin: 0 0 6px 0; font-size: 18px; font-weight: 700;">Check Your Email</h3>
                <p style="font-size: 13px; color: #64748b; margin-bottom: 20px;">We sent a 6-digit verification code to <br><strong id="display-target-email" style="color:#0f172a;"></strong></p>

                <form onsubmit="verifyAndCompleteRegistration(event)">
                    <div class="form-group">
                        <label>6-Digit Verification Code</label>
                        <input type="text" id="input-otp" class="form-input otp-input-field" maxlength="6" placeholder="• • • • • •" autocomplete="one-time-code" required>
                    </div>

                    <button type="submit" id="btn-verify-otp" class="btn-auth-submit">
                        Verify & Create Account <i class="fa-solid fa-check"></i>
                    </button>

                    <div style="margin-top: 14px; font-size: 12px; color: #64748b;">
                        Didn't receive code? <a href="javascript:void(0)" onclick="resendOTP()" style="color: #7c3aed; font-weight:600; text-decoration:none;">Change Details / Resend</a>
                    </div>
                </form>
            </div>

            <div style="text-align: center; margin-top: 20px; font-size: 13px; color: #64748b;">
                Already have an account? <a href="/login" style="color: #7c3aed; font-weight: 600; text-decoration: none;">Login</a>
            </div>

        </div>
    </div>

    <script>
        let cachedRegistrationData = {};

        async function requestSignupOTP(e) {
            e.preventDefault();

            const errorBox = document.getElementById('signup-error-alert');
            errorBox.style.display = 'none';

            const fullname = document.getElementById('reg-fullname').value.trim();
            const email = document.getElementById('reg-email').value.trim().toLowerCase();
            const phone = document.getElementById('reg-phone').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;

            // Password confirmation check
            if (password !== confirmPassword) {
                errorBox.innerText = "Passwords do not match. Please re-enter identical passwords.";
                errorBox.style.display = 'block';
                document.getElementById('reg-confirm-password').focus();
                return;
            }

            const submitBtn = document.getElementById('btn-request-otp');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Sending Code...`;

            cachedRegistrationData = { fullname, email, phone, password };

            try {
                const res = await fetch('/api/auth/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ fullname, email })
                });
                const data = await res.json();

                if (res.ok && data.status === 'success') {
                    document.getElementById('display-target-email').innerText = email;
                    document.getElementById('signup-step1-form').style.display = 'none';
                    document.getElementById('signup-step2-box').style.display = 'block';

                    if (data.debug_otp) {
                        alert(`[DEVELOPER MODE]\nYour OTP is: ${data.debug_otp}`);
                    }
                } else {
                    errorBox.innerText = data.message || "Failed to send OTP. Please check your email.";
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.innerText = "Connection error. Could not reach server.";
                errorBox.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `Send Verification Code <i class="fa-solid fa-arrow-right"></i>`;
            }
        }

        async function verifyAndCompleteRegistration(e) {
            e.preventDefault();

            const errorBox = document.getElementById('signup-error-alert');
            errorBox.style.display = 'none';

            const otp = document.getElementById('input-otp').value.trim();
            const verifyBtn = document.getElementById('btn-verify-otp');
            verifyBtn.disabled = true;
            verifyBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Verifying...`;

            const payload = {
                ...cachedRegistrationData,
                otp: otp
            };

            try {
                const res = await fetch('/api/auth/verify-and-register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok && data.status === 'success') {
                    localStorage.clear();
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userEmail', data.email);
                    localStorage.setItem('userName', data.fullname);
                    localStorage.setItem('isAdmin', data.is_admin ? 'true' : 'false');

                    alert(`🎉 Account Verified & Registered!\nWelcome to Evora, ${data.fullname}.`);
                    
                    if (data.is_admin) {
                        window.location.href = '/admin';
                    } else {
                        window.location.href = '/dashboard';
                    }
                } else {
                    errorBox.innerText = data.message || "Verification failed. Invalid or expired OTP.";
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.innerText = "Connection error. Could not reach server.";
                errorBox.style.display = 'block';
            } finally {
                verifyBtn.disabled = false;
                verifyBtn.innerHTML = `Verify & Create Account <i class="fa-solid fa-check"></i>`;
            }
        }

        function resendOTP() {
            document.getElementById('signup-error-alert').style.display = 'none';
            document.getElementById('signup-step2-box').style.display = 'none';
            document.getElementById('signup-step1-form').style.display = 'block';
        }
    </script>
</body>
</html>
